# Self-hosted GlitchTip (Sentry-compatible error tracking).
#
#   cp deploy/glitchtip/.env.example deploy/glitchtip/.env   # then edit it
#   docker compose -f deploy/glitchtip/compose.yml --env-file deploy/glitchtip/.env up -d
#
# Open http://localhost:8000 (or GLITCHTIP_DOMAIN), register the first account, create an
# organization and project, then copy the project's DSN into GLITCHTIP_DSN in the API .env.
x-environment: &default-environment
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/postgres
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  PORT: 8000
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-glitchtip@localhost}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
  ENABLE_USER_REGISTRATION: ${ENABLE_USER_REGISTRATION:-true}
  ENABLE_ORGANIZATION_CREATION: ${ENABLE_ORGANIZATION_CREATION:-true}
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS:-90}

x-depends_on: &default-depends_on
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "password"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - glitchtip-postgres:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  web:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-latest}
    restart: unless-stopped
    depends_on: *default-depends_on
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    environment: *default-environment
    volumes:
      - glitchtip-uploads:/code/uploads

  worker:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-latest}
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on: *default-depends_on
    environment: *default-environment
    volumes:
      - glitchtip-uploads:/code/uploads

  migrate:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-latest}
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on: *default-depends_on
    environment: *default-environment

volumes:
  glitchtip-postgres:
  glitchtip-uploads:
