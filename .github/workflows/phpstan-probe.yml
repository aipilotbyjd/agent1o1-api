name: PHPStan probe (temporary)

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Baseline at level 5, printed compressed
        run: |
          vendor/bin/phpstan analyse --level=5 --no-progress --memory-limit=3G --configuration=phpstan.neon --generate-baseline=phpstan-baseline.neon --allow-empty-baseline || true
          echo "BASELINE_ERRORS=$(grep -c 'message:' phpstan-baseline.neon || true)"
          echo "BASELINE_LINES=$(wc -l < phpstan-baseline.neon)"
          echo "---GZ-START---"
          gzip -9 -c phpstan-baseline.neon | base64 -w 160
          echo "---GZ-END---"
